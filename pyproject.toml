[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-search-assignment"
version = "0.1.0"
description = "A structured semantic search and HyDE comparison project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu",
  "numpy",
  "openai",
  "pandas",
  "pydantic",
  "sentence-transformers",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "config",
  "data",
  "embeddings",
  "evaluation",
  "hyde",
  "retrieval",
  "utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
